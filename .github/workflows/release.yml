name: Release workflow

on:
  push:
    tags:
      - 'v*.*.*'

env:
  COMPOMENT: coap_server

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: add version to manifest.json
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          manifest="${{ github.workspace }}/custom_components/${{ env.COMPOMENT }}/manifest.json"
          jq --arg version "$VERSION" '.version = $version' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"

      - name: Create zip file for the integration
        run: |
          cd "${{ github.workspace }}/custom_components/${{ env.COMPOMENT }}"
          zip ${{ env.COMPOMENT }}.zip -r ./
          mv ${{ env.COMPOMENT }}.zip ${{ github.workspace }}

      - name: Checkout default branch for manifest update
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: manifest-update

      - name: Commit manifest version to default branch
        env:
          VERSION: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          manifest="manifest-update/custom_components/${{ env.COMPOMENT }}/manifest.json"
          jq --arg version "$VERSION" '.version = $version' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"

          cd manifest-update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "custom_components/${{ env.COMPOMENT }}/manifest.json"
          if ! git diff --cached --quiet; then
            git commit -m "Update manifest version to $VERSION"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi

      - id: upload-firmware
        name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.COMPOMENT }}-release
          path: ${{ github.workspace }}/custom_components/${{ env.COMPOMENT }}
          retention-days: 10

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/${{ env.COMPOMENT }}.zip

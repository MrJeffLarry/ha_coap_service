name: Release workflow

on:
  push:
    tags:
      - 'v*.*.*'

env:
  COMPOMENT: coap_server

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: add version to manifest.json
        run: |
          jq --arg version "${{ github.ref_name }}" '.version = $version' ${{ github.workspace }}/custom_components/${{ env.COMPOMENT }}/manifest.json > temp_manifest.json
          rm ${{ github.workspace }}/custom_components/${{ env.COMPOMENT }}/manifest.json
          mv temp_manifest.json ${{ github.workspace }}/custom_components/${{ env.COMPOMENT }}/manifest.json

      - name: Create zip file for the integration
        run: |
          cd "${{ github.workspace }}/custom_components/${{ env.COMPOMENT }}"
          zip ${{ env.COMPOMENT }}.zip -r ./
          mv ${{ env.COMPOMENT }}.zip ${{ github.workspace }}

      - id: upload-firmware
        name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.COMPOMENT }}-release
          path: ${{ github.workspace }}/custom_components/${{ env.COMPOMENT }}
          retention-days: 10

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/${{ env.COMPOMENT }}.zip
  local:
    name: Local upload
    needs: release
    runs-on: [self-hosted, linux, x64, k8s]
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2

      - name: Download component artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.COMPOMENT }}-release
          path: ${{ github.workspace }}/${{ env.COMPOMENT }}

      - name: scp component to local server
        run: |
            ssh -t root@home.bas3.io 'rm -rf /config/custom_components/${{ env.COMPOMENT }}'
            scp -r ${{ github.workspace }}/${{ env.COMPOMENT }} root@home.bas3.io:/config/custom_components/${{ env.COMPOMENT }}
